- name: Configure the image
  hosts: default
  become: true
  tasks:
    - name: Check the distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '26.04'

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Check that nginx answers
      ansible.builtin.uri:
        url: http://localhost
