# Tools of CI, at the versions it uses: run `mise install`
[tools]
go = "1.27.1"
packer = "1.16.1"
kind = "0.33.0"
kubectl = "1.37.1"
prek = "0.5.3"
goreleaser = "2.18.2"
actionlint = "1.7.12"
ansible-core = "2.21.4"
aws-cli = "2.36.49"
jq = "1.8.2"
# virtctl, and the version of KubeVirt the tests install
"github:kubevirt/kubevirt" = { version = "1.9.0", version_prefix = "v", matching = "virtctl", rename_exe = "virtctl" }
