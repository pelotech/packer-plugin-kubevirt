# Tools of CI, at the versions it uses: run `mise install`
[tools]
go = "1.27.3"
packer = "1.16.2"
kind = "0.33.0"
kubectl = "1.37.2"
prek = "0.5.10"
goreleaser = "2.20.0"
actionlint = "1.7.12"
ansible-core = "2.22.0"
aws-cli = "2.39.3"
jq = "1.8.2"
# virtctl, and the version of KubeVirt the tests install
"github:kubevirt/kubevirt" = { version = "1.9.1", version_prefix = "v", matching = "virtctl", rename_exe = "virtctl" }

[env]
# the CDI the tests install, and the importer image of post-processor/common/job_generator.go
CDI_VERSION = "v1.66.1"
