# It uses Packer to build the Windows 11 example from its install ISO, with UEFI, Secure Boot and a TPM,
# on a KinD cluster with KubeVirt and CDI. The image is uploaded to a Garage bucket as a qcow2 file, then read back
# to check that it holds an installed and generalized Windows.
#
# The build takes about 40 minutes, so it only runs when it is started by hand.
name: test plugin with Windows

on:
  workflow_dispatch:

concurrency:
  group: test-plugin-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    name: Run Packer (Windows 11)
    timeout-minutes: 180
    env:
      working-directory: ./example/windows-11
      VM_NAME: base-windows-11
      VM_NAMESPACE: packer-windows
      S3_BUCKET: pelotech-vm-images
      PKR_VAR_destination_s3_bucket: pelotech-vm-images
      # region of .github/actions/garage/garage.yaml
      PKR_VAR_destination_s3_region: us-west-2
      # the upload runs in a pod, it reaches Garage through its service
      PKR_VAR_destination_s3_endpoint_url: "http://garage.garage.svc.cluster.local:3900"
      PKR_VAR_destination_s3_key_prefix: "ci/"
      # sized for GitHub-hosted runners (4 CPUs, 16Gi)
      PKR_VAR_vm_cpu: "2"
      PKR_VAR_vm_memory: "6Gi"
    steps:
      - name: repository checkout
        uses: actions/checkout@v7

      - name: tools setup
        uses: jdx/mise-action@v4

      - name: packer plugin setup
        uses: ./.github/actions/packer
        with:
          working-directory: ${{ env.working-directory }}

      - name: cluster setup
        uses: ./.github/actions/cluster

      - name: garage install
        uses: ./.github/actions/garage
        with:
          bucket: ${{ env.S3_BUCKET }}
          capacity: 40G

      - name: packer validate
        working-directory: ${{ env.working-directory }}
        run: |
          packer validate .

      - name: packer build
        id: build
        working-directory: ${{ env.working-directory }}
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          while true; do
            now="$(date +%H%M%S)"
            virtctl vnc screenshot "${VM_NAME}" --namespace "${VM_NAMESPACE}" --file "${RUNNER_TEMP}/screenshots/${now}.png" > /dev/null 2>&1 || true
            instance="$(kubectl get virtualmachineinstance "${VM_NAME}" --namespace "${VM_NAMESPACE}" --output jsonpath='{.status.phase} agent={.status.conditions[?(@.type=="AgentConnected")].status}' 2>/dev/null || true)"
            echo "${now} ${instance} qemu-cpu=$(ps -C qemu-kvm -o pcpu= | tr -d ' ')" >> "${RUNNER_TEMP}/screenshots/state.log"
            sleep 20
          done &

          # on failure the Virtual Machine and its disk are kept, to read the logs of Windows
          PACKER_LOG=1 packer build -on-error=abort .

      - name: check the image in the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PKR_VAR_destination_s3_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ env.PKR_VAR_destination_s3_secret_access_key }}
          AWS_REGION: us-west-2
        run: |
          kubectl port-forward --namespace garage service/garage 3900:3900 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3900
          aws s3 cp --endpoint-url http://localhost:3900 --no-progress "s3://${S3_BUCKET}/${PKR_VAR_destination_s3_key_prefix}${VM_NAME}.qcow2" "${RUNNER_TEMP}/${VM_NAME}.qcow2"

      - name: check that the build leaves nothing behind
        # the s3 post-processor, the only one, deletes the export
        run: |
          timeout 120 bash -c "while kubectl get virtualmachineexport ${VM_NAME} --namespace ${VM_NAMESPACE} > /dev/null 2>&1 || kubectl get virtualmachine ${VM_NAME} --namespace ${VM_NAMESPACE} > /dev/null 2>&1 || kubectl get persistentvolumeclaim ${VM_NAME}-source --namespace ${VM_NAMESPACE} > /dev/null 2>&1; do sleep 2; done"

      - name: check that the image holds a generalized Windows
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install --yes qemu-utils libguestfs-tools libhivex-bin ntfs-3g > /dev/null
          image="${RUNNER_TEMP}/${VM_NAME}.qcow2"
          qemu-img info "${image}"

          export LIBGUESTFS_BACKEND=direct
          sudo --preserve-env=LIBGUESTFS_BACKEND virt-filesystems --add "${image}" --all --long --human-readable | tee filesystems.txt
          grep --quiet vfat filesystems.txt
          grep --quiet ntfs filesystems.txt

          sudo --preserve-env=LIBGUESTFS_BACKEND virt-inspector --add "${image}" | tee inspection.xml | grep --extended-regexp '<(name|product_name|osinfo|major_version)>'
          # the product name in the registry of Windows 11 still says Windows 10, libguestfs tells them apart by build
          grep --quiet '<osinfo>win11</osinfo>' inspection.xml

          state="$(sudo --preserve-env=LIBGUESTFS_BACKEND virt-win-reg "${image}" 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Setup\State' ImageState)"
          echo "image state: ${state}"
          test "${state}" = IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE

      - name: upload the screenshots of the console
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: display cluster state
        if: failure()
        run: |
          df --human-readable /
          kubectl get virtualmachines,virtualmachineinstances,datavolumes,virtualmachineexports,persistentvolumeclaims,jobs,pods --all-namespaces --output wide
          kubectl describe virtualmachineinstances --namespace "${VM_NAMESPACE}"
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 50
          kubectl logs --namespace garage deployment/garage --tail 100 || true

      - name: display the logs of Windows setup and Sysprep
        if: failure() && steps.build.outcome == 'failure'
        run: |
          kubectl patch virtualmachine "${VM_NAME}" --namespace "${VM_NAMESPACE}" --type merge --patch '{"spec":{"runStrategy":"Halted"}}' || true
          kubectl delete virtualmachineinstance "${VM_NAME}" --namespace "${VM_NAMESPACE}" --grace-period 0 --force --wait=false || true
          kubectl wait virtualmachineinstance "${VM_NAME}" --namespace "${VM_NAMESPACE}" --for=delete --timeout=5m || true

          # the volumes of KinD live in the /var of its node, a Docker volume of the runner
          node_var="$(docker inspect kind-control-plane --format '{{ range .Mounts }}{{ if eq .Destination "/var" }}{{ .Source }}{{ end }}{{ end }}')"
          volume="$(kubectl get persistentvolume "$(kubectl get persistentvolumeclaim "${VM_NAME}-source" --namespace "${VM_NAMESPACE}" --output jsonpath='{.spec.volumeName}')" --output jsonpath='{.spec.hostPath.path}{.spec.local.path}')"
          disk="${node_var}${volume#/var}/disk.img"
          sudo ls -ls "${disk}"

          sudo apt-get update > /dev/null
          sudo apt-get install --yes libguestfs-tools ntfs-3g > /dev/null
          export LIBGUESTFS_BACKEND=direct
          guest() { sudo --preserve-env=LIBGUESTFS_BACKEND "$@"; }
          guest virt-filesystems --add "${disk}" --all --long --human-readable || true
          # the third partition of the answer file, in case the disk is not recognized as Windows
          guest virt-ls --add "${disk}" --long /Windows/System32/Sysprep/Panther || guest virt-ls --add "${disk}" --mount /dev/sda3 --long /Windows/System32/Sysprep/Panther || true
          for file in /Windows/Setup/State/State.ini /Windows/System32/Sysprep/Panther/setuperr.log /Windows/System32/Sysprep/Panther/setupact.log /Windows/Panther/setuperr.log; do
            echo "::group::${file}"
            { guest virt-cat --add "${disk}" "${file}" || guest virt-cat --add "${disk}" --mount /dev/sda3 "${file}"; } | tail -n 150 || true
            echo "::endgroup::"
          done
