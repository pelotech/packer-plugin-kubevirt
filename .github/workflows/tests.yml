# It runs the unit tests, and uses Packer to init, validate and build an example configuration in a folder,
# on every push or when the workflow is manually triggered.
# The image is uploaded to a Garage bucket, pushed to a registry and imported behind a DataSource,
# all in the cluster: no AWS account and no registry account are needed.
# A Virtual Machine is then started from the DataSource.
#
# A branch builds the example once per export, side by side.
# main builds it once with the three exports in a row. A manual run does both.
name: test plugin

on:
  push:
  workflow_dispatch:

# a push to a branch replaces the run of the previous one, every commit of main keeps its own run
concurrency:
  group: test-plugin-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-26.04
    name: Unit tests
    steps:
      - name: repository checkout
        uses: actions/checkout@v7

      - name: tools setup
        uses: jdx/mise-action@v4

      - name: go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # its own key: the race detector builds every package again
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: unit tests
        run: make test

  # test/parallel-builds only: two builds of the example side by side in one namespace
  build:
    runs-on: ubuntu-26.04
    name: Run Packer (${{ matrix.case }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # loop: each build has its own Kubernetes name, same-name: both builds share one
        case: ["loop", "same-name"]
    env:
      working-directory: ./example/ubuntu-26.04
      CASE: ${{ matrix.case }}
      VM_NAMESPACE: packer-linux
      # Kubernetes names of the builds a and b
      VM_NAMES: ${{ matrix.case == 'same-name' && 'base-ubuntu-2604' || 'base-ubuntu-2604-a base-ubuntu-2604-b' }}
      PKR_VAR_shared_kubernetes_name: ${{ matrix.case == 'same-name' && 'base-ubuntu-2604' || '' }}
      # both builds would push the same tag
      PACKER_EXCEPT: oci
      S3_BUCKET: pelotech-vm-images
      PKR_VAR_destination_aws_s3_bucket: pelotech-vm-images
      # region of .github/actions/garage/garage.yaml
      PKR_VAR_destination_aws_region: us-west-2
      # the upload runs in a pod, it reaches Garage through its service
      PKR_VAR_destination_s3_endpoint_url: "http://garage.garage.svc.cluster.local:3900"
      PKR_VAR_destination_aws_s3_key_prefix: "ci/"
      # two VMs of 2 CPUs and the control plane do not fit in the 4 CPUs of the runner
      PKR_VAR_vm_cpu: "1"
      PKR_VAR_vm_memory: "4Gi"
    steps:
      - name: repository checkout
        uses: actions/checkout@v7

      - name: tools setup
        uses: jdx/mise-action@v4

      - name: packer plugin setup
        uses: ./.github/actions/packer
        with:
          working-directory: ${{ env.working-directory }}

      - name: cluster setup
        uses: ./.github/actions/cluster

      - name: garage install
        uses: ./.github/actions/garage
        with:
          bucket: ${{ env.S3_BUCKET }}

      - name: display runner node / capabilities
        run: |
          lscpu | grep -E '^CPU\(s\)|^Model name'
          free -h
          kubectl describe nodes | sed -n '/^Allocatable:/,/^Events:/p'

      - name: packer format
        run: |
          packer fmt -check .

      - name: packer validate
        working-directory: ${{ env.working-directory }}
        run: |
          packer validate ${PACKER_EXCEPT:+-except=${PACKER_EXCEPT}} .

      - name: packer build
        working-directory: ${{ env.working-directory }}
        run: |
          set -o pipefail
          # what the node has scheduled while both builds run
          (for minute in 4 8; do sleep 240; { echo "--- after ${minute} minutes"; kubectl get pods,virtualmachineinstances --namespace "${VM_NAMESPACE}" --output wide; kubectl describe nodes | sed -n '/^Allocated resources:/,/^Events:/p'; } >> "${RUNNER_TEMP}/node.log" 2>&1; done) &
          status=0
          PACKER_LOG=1 PACKER_LOG_PATH="${RUNNER_TEMP}/packer-debug.log" packer build -color=false -timestamp-ui ${PACKER_EXCEPT:+-except=${PACKER_EXCEPT}} . 2>&1 | tee "${RUNNER_TEMP}/packer.log" || status=$?
          echo "packer build exit code: ${status}"
          echo "PACKER_EXIT=${status}" >> "${GITHUB_ENV}"
          # the same-name leg expects a failed build, the steps below judge it
          if [ "${CASE}" = loop ]; then exit "${status}"; fi

      - name: display the node while both builds ran
        if: always()
        run: |
          cat "${RUNNER_TEMP}/node.log" || true

      - name: check that the two builds overlapped
        if: matrix.case == 'loop'
        run: |
          log="${RUNNER_TEMP}/packer.log"
          grep -E "kubevirt-iso\.[ab]: (creating Virtual Machine |port-forwarding step|export step has completed)|Build 'kubevirt-iso\.[ab]' (finished|errored)" "${log}"
          at() { date -d "$(grep -m1 -E "$1" "${log}" | cut -d' ' -f1 | sed 's/:$//')" +%s; }
          start_a=$(at "==> kubevirt-iso\.a: creating Virtual Machine ")
          end_a=$(at "==> kubevirt-iso\.a: export step has completed")
          start_b=$(at "==> kubevirt-iso\.b: creating Virtual Machine ")
          end_b=$(at "==> kubevirt-iso\.b: export step has completed")
          overlap=$(( (end_a < end_b ? end_a : end_b) - (start_a > start_b ? start_a : start_b) ))
          echo "a: ${start_a} to ${end_a} ($((end_a - start_a))s), b: ${start_b} to ${end_b} ($((end_b - start_b))s), overlap: ${overlap}s"
          test "${overlap}" -gt 0

      - name: check the outcome of the builds sharing one name
        if: matrix.case == 'same-name'
        run: |
          log="${RUNNER_TEMP}/packer.log"
          grep -E "already exists|creating Virtual Machine |export step has completed|has been deleted|has been kept|Build 'kubevirt-iso\.[ab]' (finished|errored)" "${log}"
          test "${PACKER_EXIT}" -ne 0
          finished=$(sed -nE "s/.*Build 'kubevirt-iso\.([a-z]+)' finished.*/\1/p" "${log}")
          errored=$(sed -nE "s/.*Build 'kubevirt-iso\.([a-z]+)' errored.*/\1/p" "${log}")
          echo "finished: [${finished}], errored: [${errored}]"
          test "$(echo "${finished}" | wc -w)" -eq 1
          test "$(echo "${errored}" | wc -w)" -eq 1
          grep -E "Build 'kubevirt-iso\.${errored}' errored.*failed to create Virtual Machine ${VM_NAMESPACE}/${VM_NAMES}: .*already exists" "${log}"
          # the failed build stopped at the VM create and deleted nothing
          if grep -E "kubevirt-iso\.${errored}: .*(has been deleted|waiting for Virtual Machine|creating Virtual Machine Export)" "${log}"; then exit 1; fi
          grep -E "==> kubevirt-iso\.${finished}: export step has completed for Virtual Machine ${VM_NAMESPACE}/${VM_NAMES}" "${log}"
          echo "FINISHED=${finished}" >> "${GITHUB_ENV}"
          echo "ERRORED=${errored}" >> "${GITHUB_ENV}"

      - name: check the images in the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PKR_VAR_destination_aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ env.PKR_VAR_destination_aws_secret_access_key }}
          AWS_REGION: us-west-2
        run: |
          kubectl port-forward --namespace garage service/garage 3900:3900 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3900
          aws s3api list-objects-v2 --endpoint-url http://localhost:3900 --bucket "${S3_BUCKET}" --query 'Contents[].[Key,Size,LastModified]' --output text
          for name in ${VM_NAMES}; do
            aws s3api head-object --endpoint-url http://localhost:3900 --bucket "${S3_BUCKET}" --key "${PKR_VAR_destination_aws_s3_key_prefix}${name}.img.gz"
          done

      - name: check the DataSources
        run: |
          if [ "${CASE}" = loop ]; then expected="a b"; else expected="${FINISHED}"; fi
          for build in ${expected}; do
            kubectl wait "datasource/base-ubuntu-${build}" --namespace "${VM_NAMESPACE}" --for=condition=Ready --timeout=1m
            test "$(kubectl get datasource "base-ubuntu-${build}" --namespace "${VM_NAMESPACE}" --output jsonpath='{.metadata.labels.instancetype\.kubevirt\.io/default-preference}')" = ubuntu
          done
          if [ "${CASE}" = same-name ]; then
            if kubectl get datasource "base-ubuntu-${ERRORED}" --namespace "${VM_NAMESPACE}"; then exit 1; fi
          fi
          kubectl get datasources --namespace "${VM_NAMESPACE}"

      - name: check that the builds leave nothing behind
        run: |
          for name in ${VM_NAMES}; do
            timeout 120 bash -c "while kubectl get virtualmachineexport ${name} --namespace ${VM_NAMESPACE} > /dev/null 2>&1 || kubectl get virtualmachine ${name} --namespace ${VM_NAMESPACE} > /dev/null 2>&1 || kubectl get persistentvolumeclaim ${name}-source --namespace ${VM_NAMESPACE} > /dev/null 2>&1; do sleep 2; done"
          done

      - name: display the namespace
        if: always()
        run: |
          kubectl get virtualmachines,virtualmachineinstances,virtualmachineexports,datavolumes,datasources,persistentvolumeclaims,jobs,secrets,configmaps,pods --namespace "${VM_NAMESPACE}" --output wide || true

      - name: display the packer debug log
        if: always()
        run: |
          cat "${RUNNER_TEMP}/packer-debug.log" || true

      - name: display cluster state
        if: failure()
        run: |
          kubectl get virtualmachines,virtualmachineinstances,datavolumes,datasources,virtualmachineexports,persistentvolumeclaims,jobs,pods --all-namespaces --output wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 80
          kubectl describe pods --namespace "${VM_NAMESPACE}" || true
