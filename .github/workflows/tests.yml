# It uses Packer to init, validate and build an example configuration in a folder,
# on every push or when the workflow is manually triggered.
# The image is uploaded to a Garage bucket, pushed to a registry and imported behind a DataSource,
# all in the cluster: no AWS account and no registry account are needed.
# A Virtual Machine is then started from the DataSource.
#
# A branch builds the example once per export, side by side.
# main builds it once with the three exports in a row. A manual run does both.
name: test plugin

on:
  push:
  workflow_dispatch:

# a push to a branch replaces the run of the previous one, every commit of main keeps its own run
concurrency:
  group: test-plugin-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

env:
  PRODUCT_VERSION: "1.16.1"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run Packer (${{ matrix.export }})
    strategy:
      fail-fast: false
      matrix:
        export: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["s3", "oci", "datasource", "all"]' || github.ref == 'refs/heads/main' && '["all"]' || '["s3", "oci", "datasource"]') }}
    env:
      working-directory: ./example/ubuntu-26.04
      # post-processors of the example this leg does not run, by name
      PACKER_EXCEPT: ${{ matrix.export == 's3' && 'oci,datasource' || matrix.export == 'oci' && 's3,datasource' || matrix.export == 'datasource' && 's3,oci' || '' }}
      # bucket of example/ubuntu-26.04/values.auto.pkrvars.hcl
      S3_BUCKET: pelotech-vm-images
      # the upload runs in a pod, it reaches Garage through its service
      PKR_VAR_destination_s3_endpoint_url: "http://garage.garage.svc.cluster.local:3900"
      PKR_VAR_destination_aws_s3_key_prefix: "ci/"
      OCI_REPOSITORY: pelotech/base-ubuntu
      OCI_TAG: "26.04"
      # the push runs in a pod, it reaches the registry through its service
      PKR_VAR_destination_oci_image: "registry.registry.svc.cluster.local:5000/pelotech/base-ubuntu:26.04"
      PKR_VAR_destination_oci_registry_insecure: "true"
      # sized for GitHub-hosted runners (4 CPUs, 16Gi)
      PKR_VAR_vm_cpu: "2"
      PKR_VAR_vm_memory: "4Gi"
    steps:
      - name: repository checkout
        uses: actions/checkout@v7

      - name: go setup
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: ./packer-plugin-kubevirt
          key: build-${{ hashFiles('**/*.go') }}

      - name: packer plugin build
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build .

      - name: generate kind config
        run: |
          cat <<EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraMounts:
              - hostPath: /dev/kvm
                containerPath: /dev/kvm
          EOF

      - name: kind setup
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
          version: v0.33.0
          kubectl_version: v1.37.1
          config: kind-config.yaml

      - name: kubevirt+cdi install
        run: |
          export KUBEVIRT_VERSION=$(curl -s https://storage.googleapis.com/kubevirt-prow/release/kubevirt/kubevirt/stable.txt)
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"

          export CDI_VERSION=$(basename $(curl -s -w %{redirect_url} https://github.com/kubevirt/containerized-data-importer/releases/latest))
          kubectl create -f https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-operator.yaml
          kubectl create -f https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-cr.yaml

          kubectl wait --for=jsonpath='{.status.phase}'=Deployed kubevirt/kubevirt --namespace kubevirt --timeout=10m
          kubectl wait --for=jsonpath='{.status.phase}'=Deployed cdi/cdi --namespace cdi --timeout=10m

          kubectl apply -k "https://github.com/kubevirt/common-instancetypes/VirtualMachineClusterPreferences?ref=v1.7.0"
          # to skip '/dev/kvm' requirement - but requires testing with custom node and host volume mounting
          # kubectl -n kubevirt patch kubevirt kubevirt --type=merge --patch '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'

      - name: garage install
        if: matrix.export == 's3' || matrix.export == 'all'
        run: |
          kubectl create namespace garage
          kubectl create secret generic garage --namespace garage --from-literal=rpc-secret="$(openssl rand -hex 32)"
          kubectl apply -f .github/garage.yaml
          kubectl rollout status deployment/garage --namespace garage --timeout=5m

          garage() { kubectl exec --namespace garage deployment/garage -- /garage "$@"; }
          garage layout assign --zone kind --capacity 10G "$(garage node id -q)"
          garage layout apply --version 1

          access_key_id="GK$(openssl rand -hex 12)"
          secret_access_key="$(openssl rand -hex 32)"
          echo "::add-mask::${secret_access_key}"
          garage key import --yes -n packer "${access_key_id}" "${secret_access_key}" > /dev/null
          garage bucket create "${S3_BUCKET}"
          garage bucket allow --read --write "${S3_BUCKET}" --key packer

          echo "PKR_VAR_destination_aws_access_key_id=${access_key_id}" >> "${GITHUB_ENV}"
          echo "PKR_VAR_destination_aws_secret_access_key=${secret_access_key}" >> "${GITHUB_ENV}"

      - name: registry install
        if: matrix.export == 'oci' || matrix.export == 'all'
        run: |
          kubectl create namespace registry
          kubectl apply -f .github/registry.yaml
          kubectl rollout status deployment/registry --namespace registry --timeout=5m

      - name: display runner node / capabilities
        run: |
          # Print CPU information
          echo "CPU Information:"
          echo "----------------"
          lscpu | grep -E '^Architecture|^CPU\(s\)|^Model name|^Thread|^Core|^Socket|^Vendor ID'
          echo ""

          # Print Memory information
          echo "Memory Information:"
          echo "-------------------"
          free -h
          echo ""

          # Print Disk Space information
          echo "Disk Space Information:"
          echo "-----------------------"
          df -hT | awk '{print $1, $2, $3, $4, $5, $6, $7}'
          echo ""

          echo "KVM module state:"
          echo "-----------------------"
          if lsmod | grep -q kvm; then
            echo "KVM modules are loaded."
          else
            echo "KVM modules are not loaded."
          fi
          echo ""

          echo "Kubernetes worker nodes:"
          echo "-----------------------"
          kubectl get nodes -o jsonpath='{range .items[*]}{"["}{.metadata.name}{"] cpu: "}{.status.capacity.cpu}{"; memory: "}{.status.capacity.memory}{"\n"}{end}'

      - name: packer setup
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: packer format
        run: |
          packer fmt -check .

      - name: packer init
        working-directory: ${{ env.working-directory }}
        run: |
          packer plugins install --path ../../packer-plugin-kubevirt "github.com/pelotech/kubevirt"
          packer init .

      - name: packer validate
        working-directory: ${{ env.working-directory }}
        run: |
          packer validate ${PACKER_EXCEPT:+-except=${PACKER_EXCEPT}} .

      - name: packer build
        working-directory: ${{ env.working-directory }}
        run: |
          PACKER_LOG=1 packer build ${PACKER_EXCEPT:+-except=${PACKER_EXCEPT}} .

      - name: check the image in the bucket
        if: matrix.export == 's3' || matrix.export == 'all'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PKR_VAR_destination_aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ env.PKR_VAR_destination_aws_secret_access_key }}
          AWS_REGION: us-west-2
        run: |
          kubectl port-forward --namespace garage service/garage 3900:3900 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3900
          aws s3api head-object --endpoint-url http://localhost:3900 --bucket "${S3_BUCKET}" --key "${PKR_VAR_destination_aws_s3_key_prefix}base-ubuntu-2604.img.gz"

      - name: check the image in the registry
        if: matrix.export == 'oci' || matrix.export == 'all'
        run: |
          kubectl port-forward --namespace registry service/registry 5000:5000 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:5000/v2/
          manifest="$(curl --silent --fail --header 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' "http://localhost:5000/v2/${OCI_REPOSITORY}/manifests/${OCI_TAG}")"
          config="$(curl --silent --fail --location "http://localhost:5000/v2/${OCI_REPOSITORY}/blobs/$(echo "${manifest}" | jq --raw-output .config.digest)")"
          echo "${config}" | jq --exit-status '.config.Env | index("INSTANCETYPE_KUBEVIRT_IO_DEFAULT_PREFERENCE=ubuntu")'
          echo "${manifest}" | jq --exit-status '.layers | length == 1'

      - name: check the DataSource and boot a Virtual Machine from it
        if: matrix.export == 'datasource' || matrix.export == 'all'
        run: |
          kubectl wait datasource/base-ubuntu --namespace packer-linux --for=condition=Ready --timeout=1m
          test "$(kubectl get datasource base-ubuntu --namespace packer-linux --output jsonpath='{.metadata.labels.instancetype\.kubevirt\.io/default-preference}')" = ubuntu
          kubectl apply -f .github/boot-test.yaml
          test "$(kubectl get virtualmachine boot-test --namespace packer-linux --output jsonpath='{.spec.preference.name}')" = ubuntu
          kubectl wait virtualmachine/boot-test --namespace packer-linux --for=condition=Ready --timeout=10m
          kubectl wait virtualmachineinstance/boot-test --namespace packer-linux --for=condition=AgentConnected --timeout=5m

      - name: display cluster state
        if: failure()
        run: |
          kubectl get virtualmachines,virtualmachineinstances,datavolumes,datasources,virtualmachineexports,persistentvolumeclaims,jobs,pods --all-namespaces --output wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 50
          kubectl describe pods --namespace garage
          kubectl logs --namespace garage deployment/garage --tail 100 || true
          kubectl describe pods --namespace registry
          kubectl logs --namespace registry deployment/registry --tail 100 || true
