# Virtual Machine of the integration test, it boots from the DataSource created by the build.
# It sets no preference, KubeVirt infers it from the DataSource.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: boot-test
  namespace: packer-linux
spec:
  runStrategy: Always
  preference:
    inferFromVolume: disk
  dataVolumeTemplates:
    - metadata:
        name: boot-test
      spec:
        sourceRef:
          kind: DataSource
          name: base-ubuntu
        storage:
          resources:
            requests:
              storage: 4Gi
  template:
    spec:
      domain:
        cpu:
          sockets: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: disk
              disk: {}
      volumes:
        - name: disk
          dataVolume:
            name: boot-test
